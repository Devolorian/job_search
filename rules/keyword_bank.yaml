# Keyword vocabulary for Analytics Engineer / DWH roles, 2026.
#
# HOW THIS IS USED (read this before editing):
#   - `core_*` groups drive the stack-overlap component of the match score.
#   - The tailoring step may surface a keyword in the rendered CV ONLY if
#     cv/master_cv.yaml already evidences it. This file is a vocabulary for
#     RECOGNISING and SCORING job descriptions — it is NOT a list of things to
#     claim. See CLAUDE.md rule 2.
#   - `expansions` supply the acronym+full-form pairing required by ATS rule 21.

