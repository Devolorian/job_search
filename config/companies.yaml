# Companies whose career boards are polled directly.
#
# WHY THIS IS THE PRIMARY SOURCE (measured 2026-09-07):
#   Generic remote boards  - 469 postings scanned -> 9 role matches, mostly noise
#                            ("Data Analyst (No Experience Required)")
#   Company ATS boards     - 42 companies probed  -> 26 role matches, including
#                            "Senior Analytics Engineer - Barcelona" at Preply
#
# These are the official public job-board APIs of Greenhouse, Ashby, Lever and Workable.
# No auth, no scraping, no robots.txt conflict - they exist to be read by job aggregators.
# The provider for each company is resolved automatically and cached in
# state/ats_boards.json; you only need to add the slug.
#
# To find a company's slug: open its careers page and look at the URL, e.g.
#   job-boards.greenhouse.io/COMPANY   ->  greenhouse slug
#   jobs.ashbyhq.com/COMPANY           ->  ashby slug
#   jobs.lever.co/COMPANY              ->  lever slug
#   apply.workable.com/COMPANY         ->  workable slug

